name: Package CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-runtime:
    uses: moglang/package-actions/.github/workflows/source-ci.yml@v1
    with:
      package_name: path
      runtime_ref: v0.1.4
      test_command: |
        for fixture in "$PACKAGE_STAGE"/tests/errors/*.mog; do
          [[ -e "$fixture" ]] || continue
          if MOG_CACHE_DIR="$RUNNER_TEMP/mog-cache" "$MOG_RUNTIME" run "$fixture"; then
            echo "Expected failure fixture succeeded: $fixture" >&2
            exit 1
          fi
        done

  current-runtime:
    uses: moglang/package-actions/.github/workflows/source-ci.yml@v1
    with:
      package_name: path
      runtime_ref: main
      test_command: |
        for fixture in "$PACKAGE_STAGE"/tests/errors/*.mog; do
          [[ -e "$fixture" ]] || continue
          if MOG_CACHE_DIR="$RUNNER_TEMP/mog-cache" "$MOG_RUNTIME" run "$fixture"; then
            echo "Expected failure fixture succeeded: $fixture" >&2
            exit 1
          fi
        done
