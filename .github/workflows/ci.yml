name: Package CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the protected compatibility-floor context during the 0.2.0 bootstrap.
  # Pin this to v0.2.0 after the Kelvra runtime release is published.
  minimum-runtime:
    uses: kelvralang/package-actions/.github/workflows/source-ci.yml@v2
    with:
      package_name: path
      runtime_ref: main
      test_command: |
        for fixture in "$PACKAGE_STAGE"/tests/errors/*.kel; do
          [[ -e "$fixture" ]] || continue
          if KELVRA_CACHE_DIR="$RUNNER_TEMP/kelvra-cache" "$KELVRA_RUNTIME" run "$fixture"; then
            echo "Expected failure fixture succeeded: $fixture" >&2
            exit 1
          fi
        done

  current-runtime:
    uses: kelvralang/package-actions/.github/workflows/source-ci.yml@v2
    with:
      package_name: path
      runtime_ref: main
      test_command: |
        for fixture in "$PACKAGE_STAGE"/tests/errors/*.kel; do
          [[ -e "$fixture" ]] || continue
          if KELVRA_CACHE_DIR="$RUNNER_TEMP/kelvra-cache" "$KELVRA_RUNTIME" run "$fixture"; then
            echo "Expected failure fixture succeeded: $fixture" >&2
            exit 1
          fi
        done
