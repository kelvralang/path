name: Release source package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: kelvralang/package-actions/.github/workflows/source-release.yml@v2
    with:
      package_name: path
      runtime_ref: main
      test_command: |
        for fixture in "$PACKAGE_STAGE"/tests/errors/*.kel; do
          [[ -e "$fixture" ]] || continue
          if KELVRA_CACHE_DIR="$RUNNER_TEMP/kelvra-cache" "$KELVRA_RUNTIME" run "$fixture"; then
            echo "Expected failure fixture succeeded: $fixture" >&2
            exit 1
          fi
        done
